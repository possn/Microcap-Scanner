name: Sector Momentum Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Data de início (YYYY-MM-DD)"
        required: false
        default: "2005-01-01"
      mode:
        description: "Modo: 'backtest' (uma combinação) ou 'grid' (varrer lookback x horizon)"
        required: false
        default: "grid"
      lookback:
        description: "Meses de retorno trailing (só modo backtest)"
        required: false
        default: "6"
      horizon:
        description: "Meses forward a medir (só modo backtest)"
        required: false
        default: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install yfinance pandas numpy

      - name: Correr backtest ou grid-scan
        run: |
          if [ "${{ github.event.inputs.mode }}" = "grid" ]; then
            python backtest_sector_momentum.py \
              --start "${{ github.event.inputs.start_date }}" \
              --grid \
              > momentum_output.txt
          else
            python backtest_sector_momentum.py \
              --start "${{ github.event.inputs.start_date }}" \
              --lookback "${{ github.event.inputs.lookback }}" \
              --horizon "${{ github.event.inputs.horizon }}" \
              > momentum_output.txt
          fi
          cat momentum_output.txt

      - name: Guardar resultado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: momentum-results
          path: momentum_output.txt

      - name: Enviar resumo para Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          SUMMARY=$(head -c 3500 momentum_output.txt)
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode text="${SUMMARY}"
