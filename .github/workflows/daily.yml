name: heartbeat-stage2-daily

on:
  workflow_dispatch: {}
  schedule:
    # 21:20 UTC, depois do fecho regular dos EUA; segunda a sexta.
    - cron: "20 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: heartbeat-stage2-daily
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q

      - name: Run Heartbeat Stage 2 scanner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          MIN_PRICE: "0.08"
          MAX_PRICE: "500.00"
          MAX_MARKET_CAP: "10000000000"
          STRICT_MARKET_CAP: "1"
          STRICT_FLOAT: "0"

          MIN_HISTORY_SESSIONS: "190"
          MIN_BASE_SESSIONS: "84"
          PREFERRED_BASE_SESSIONS: "126"
          MAX_BASE_SESSIONS: "252"

          BREAKOUT_MIN_AGE: "10"
          BREAKOUT_MAX_AGE: "90"
          BREAKOUT_VOLUME_MULT: "2.0"
          MAX_GAIN_SINCE_BREAKOUT: "0.50"
          MAX_DISTANCE_SMA150: "0.35"

          MAX_ATR_CONTRACTION_RATIO: "0.78"
          MAX_WEEKLY_RANGE_RATIO: "0.82"
          MAX_BASE_DRAWDOWN: "0.62"
          MAX_RECENT_VERTICAL_DROP: "0.45"

          MIN_AVG_VOLUME_20: "100000"
          MIN_AVG_DOLLAR_VOLUME_20: "75000"
          MAX_CANDIDATES: "0"
          BREAKOUT_VOLUME_WINDOW: "5"
          NEAR_MISS_LIMIT: "5"
          MAX_RESULTS: "10"
          MIN_QUALITY_SCORE: "68"
          MIN_REWARD_RISK: "2.0"
          MIN_CLOSE_LOCATION: "0.60"
          MAX_FAILED_BREAKOUTS: "3"
          REQUEST_PAUSE: "0.12"
        run: python scanner.py

      - name: Commit scanner outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add cache/heartbeat_results.json cache/heartbeat_results.csv cache/last_run.json cache/signal_journal.json cache/ohlcv || true
          git commit -m "Update Heartbeat Stage 2 scan" || exit 0
          git push
